name: build-assets

# ============================================================================
# 明文译文 → 游戏资产（三段式门禁）
# ----------------------------------------------------------------------------
# text/*.jsonl 是译文的唯一真相源，明文入库、人工可读可审。本工作流负责把它
# 编译成 DLL 与打包工具消费的资产，并在每一步都拦一次错。
#
# 为什么分三段（而不是一个 job 从头跑到尾）
#   1. verify-text  只看文本层：结构、状态、占位符、专名、英文残留、数字丢失。
#                   这一层失败说明「译文本身有问题」，跟打包器无关。
#   2. package      文本 → 资产，然后跑 verify_assets 独立复核。
#   3. recheck      在**全新容器**里只下载 artifact 再验一次，不碰工作区。
#                   这一步才是真正证明「发布给玩家的产物是自洽的」——前两步
#                   都可能因为工作区里残留的中间文件而假阳性。
#
# 为什么不在这里编译 DLL
#   原版游戏有版权，不进仓库也不进 runner；DLL 编译需要 MSVC 工具链，
#   单独放在 build-dll.yml 里，只依赖本工作流产出的资产。
#
# 产物（artifact: tak-assets）
#   patches.json     全部已译条，按源文件聚合的写回指令
#   translate/**.tdf 01 组自足生成的多语言词条表（含 Chinese 槽）
#   dict.json        DLL 运行时字典：forward 供 sub_544020，reverse 供 sub_544110
#   icd_patch.json   06 组：文件偏移 → GBK 译文（供内存补丁）
#   summary.json     统计与自描述元信息
# ============================================================================

on:
  push:
    branches: [master, main]
    paths:
      - 'text/**'
      - 'tools/**'
      - '.github/workflows/build-assets.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'text/**'
      - 'tools/**'
      - '.github/workflows/build-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连推多次时取消旧构建，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 所有脚本都与中文交互；CI 默认 locale 不是 UTF-8，不设会 UnicodeEncodeError
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ── 第一段：文本层门禁 ───────────────────────────────────────────────
  verify-text:
    name: 校验待译表
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # 结构校验：id 唯一、字段齐全、status 合法、done 的译文占位符守恒。
      # 它是「表本身有没有坏」，与译文质量无关，所以放在最前面。
      - name: 校验表结构与占位符
        run: python tools/verify_strings.py --text text

      # 质量体检：专名锁定、英文残留、数字丢失。--strict 让 warning 也算失败，
      # 否则「有一条专名没锁住」会被静默放过，等玩家看到才发现。
      - name: 质量体检（专名 / 英文残留 / 数字）
        run: python tools/check_quality.py --text text --strict

      # GBK 编不了的字符会被打包器写成单字节，插进双字节流里让整张表报废。
      # 这里只是预演（不带 --write），有残留就让 CI 红。
      - name: 检查 GBK 不安全字符（只报告，不改文件）
        run: |
          set -euo pipefail
          python tools/clean_text.py --text text | tee /tmp/clean.log
          if ! grep -q '没有需要清洗的字符' /tmp/clean.log; then
            echo "::error::译文里仍有 GBK 编不了的字符，请本地跑 tools/clean_text.py --write 后提交"
            exit 1
          fi

  # ── 第二段：打包 + 独立复核 ─────────────────────────────────────────
  package:
    name: 打包资产
    needs: verify-text
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # --strict：01-06 组只要还有一条未译就失败。
      # 不跑 --game：原版游戏不在 runner 上（版权 + 体积），CI 只出资产。
      - name: 生成资产
        run: python tools/build_assets.py --text text --out build_out --slot Chinese --strict

      # 第二双眼睛：不复用 build_assets 的任何函数，重算占位符/TDF/字典一致性。
      # 自己校验自己等于没校验 —— 同一个 bug 会同时写进产物和检查逻辑。
      - name: 独立复核产物
        run: python tools/verify_assets.py --out build_out --strict

      - name: 写作业摘要
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 资产打包结果"
            echo
            if [ -f build_out/summary.json ]; then
              echo '```json'
              cat build_out/summary.json
              echo '```'
            else
              echo "没有 summary.json —— 打包阶段失败。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传资产
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tak-assets
          path: |
            build_out/patches.json
            build_out/translate/**
            build_out/dict.json
            build_out/icd_patch.json
            build_out/summary.json
          if-no-files-found: error
          retention-days: 90

  # ── 第三段：在干净环境里复验 artifact ───────────────────────────────
  recheck:
    name: 复验产物（干净环境）
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 只 checkout 仓库拿到校验脚本，不 checkout 任何中间产物
      - name: 检出仓库（只要脚本）
        uses: actions/checkout@v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: 下载上一步的产物
        uses: actions/download-artifact@v8.0.2
        with:
          name: tak-assets
          path: build_out

      # 先验「该有的文件都在」。upload-artifact 的 glob 写错会静默少传，
      # 而后续 DLL 构建只会看到「找不到 dict.json」这种二手错误。
      - name: 检查产物齐全
        run: |
          set -euo pipefail
          miss=0
          for f in patches.json dict.json icd_patch.json summary.json; do
            if [ ! -s "build_out/$f" ]; then
              echo "::error::缺少 $f"
              miss=1
            fi
          done
          n=$(find build_out -name '*.tdf' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::translate/ 里没有 .tdf"
            miss=1
          fi
          echo "tdf 份数: $n"
          exit $miss

      # 这里的 build_out 完全来自 artifact，与工作区无关 ——
      # 通过即说明「玩家/后续构建拿到的就是对的」。
      - name: 复验（与打包阶段同一套判据）
        run: python tools/verify_assets.py --out build_out --strict
